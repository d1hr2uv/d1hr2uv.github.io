<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Dhruba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f7;
            --text: #363636;
            --text-secondary: #5c5c5c;
            --text-muted: #9a9a9a;
            --accent: #a86e5a;
            --border: #e8e6e2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a19;
                --text: #e0dfdc;
                --text-secondary: #a8a7a4;
                --text-muted: #6e6e6c;
                --accent: #c49a88;
                --border: #2c2c2a;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Newsreader', Georgia, serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }

        p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="/">← Go home</a>
</body>
</html>
