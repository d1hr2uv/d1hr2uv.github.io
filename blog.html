<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- SEO -->
    <meta name="description" content="Writing by Dhruba on AI agents, developer tools, and APIs.">
    <meta name="author" content="Dhruba">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://d1hr2uv.github.io/blog.html">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Writing — Dhruba">
    <meta property="og:description" content="Writing by Dhruba on AI agents, developer tools, and APIs.">
    <meta property="og:url" content="https://d1hr2uv.github.io/blog.html">
    <meta property="og:site_name" content="Dhruba">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@dhruv2038">
    <meta name="twitter:title" content="Writing — Dhruba">
    <meta name="twitter:description" content="Writing by Dhruba on AI agents, developer tools, and APIs.">
    
    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml" title="Dhruba" href="https://d1hr2uv.github.io/feed.xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f7;
            --text: #363636;
            --text-secondary: #5c5c5c;
            --text-muted: #9a9a9a;
            --accent: #a86e5a;
            --border: #e8e6e2;
            --surface: #ffffff;
        }

        [data-theme="dark"] {
            --bg: #1a1a19;
            --text: #e0dfdc;
            --text-secondary: #a8a7a4;
            --text-muted: #6e6e6c;
            --accent: #c49a88;
            --border: #2c2c2a;
            --surface: #222221;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 17px;
        }

        body {
            font-family: 'Newsreader', Georgia, serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
            padding: 4rem 2rem 6rem;
            max-width: 600px;
            margin: 0 auto;
            transition: background 0.4s ease, color 0.4s ease;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: var(--accent);
            color: var(--bg);
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        a:hover {
            opacity: 0.7;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            letter-spacing: 0.01em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text);
            opacity: 1;
        }

        .nav-links a:first-child {
            color: var(--text);
            font-weight: 500;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            padding: 0.4rem 0;
            transition: color 0.2s ease;
        }

        .theme-toggle:hover {
            color: var(--text);
        }

        /* Header */
        header {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: -0.03em;
        }

        /* Posts */
        .post {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
        }

        .post:first-of-type {
            border-top: 1px solid var(--border);
        }

        .post-date {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
        }

        .post-title {
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .post-title a {
            color: var(--text);
        }

        .post-title a:hover {
            color: var(--accent);
            opacity: 1;
        }

        .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            margin-top: 4rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
        }

        footer a {
            color: var(--text-muted);
        }

        footer a:hover {
            color: var(--accent);
            opacity: 1;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">Dhruba</a>
            <a href="blog.html">Writing</a>
            <a href="mailto:hello@example.com">Contact</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">Dark</button>
    </nav>

    <header>
        <h1>Writing</h1>
    </header>

    <main>
        <article class="post">
            <div class="post-date">December 2025</div>
            <h2 class="post-title"><a href="api-agents.html">If APIs aren't designed for agents, they might get bypassed</a></h2>
            <p class="post-excerpt">If your API is under-documented or inconsistent, AI agents won't wait around. They'll bypass it entirely and use computer-use instead.</p>
        </article>
    </main>

    <footer>
        <a href="index.html">← Home</a>
    </footer>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.querySelector('.theme-toggle');
            
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.querySelector('.theme-toggle').textContent = 'Light';
            }
        })();
    </script>
</body>
</html>
